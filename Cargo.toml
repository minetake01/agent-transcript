[package]
name = "agent-transcript"
version = "0.1.0"
edition = "2021"
description = "Read-only archive of coding-agent transcripts on Cloudflare R2."
license = "Apache-2.0"
rust-version = "1.96"

[[bin]]
name = "agent-transcript"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-sdk-s3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
rmcp = { version = "2.2", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
toml = "0.8"
txcript = { version = "0.14.4", default-features = false, features = ["search", "opencode", "hermes"] }
url = "2"

[dev-dependencies]
tempfile = "3"
